<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safe Place</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>🏡 Safe Place</h1>
      <div id="status" class="status status--off">Not connected</div>
    </header>

    <!-- LOBBY -->
    <section id="lobby" class="screen">
      <div class="name-row">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" maxlength="16" placeholder="Player" autocomplete="off">
      </div>
      <div class="cards">
        <div class="card">
          <h2>Create Room</h2>
          <p>You become the host and choose the games.</p>
          <button id="btn-create" class="btn btn--primary">Create Room</button>
        </div>

        <div class="card">
          <h2>Join Room</h2>
          <p>Enter the code the host sent you.</p>
          <input id="join-input" type="text" placeholder="Paste room code" autocomplete="off" spellcheck="false">
          <button id="btn-join" class="btn btn--primary">Join Room</button>
        </div>
      </div>
      <p id="lobby-msg" class="muted center"></p>
    </section>

    <!-- GAME HUB -->
    <section id="hub" class="screen hidden">
      <div class="hub-layout">
        <aside id="sidebar" class="sidebar">
          <div class="side-head">
            <button id="btn-side-toggle" class="btn btn--ghost side-toggle" title="Room info &amp; players">☰ <span id="side-count">0</span> 👥</button>
            <div class="side-actions">
              <button id="btn-mic" class="btn mic-btn mic-btn--off" title="Mute / unmute your microphone">Mic: Off</button>
              <button id="btn-cam" class="btn cam-btn cam-btn--off" title="Turn your camera on or off">Cam: Off</button>
              <button id="btn-screen" class="btn screen-btn screen-btn--off" title="Share your screen with the room">Share Screen</button>
              <button id="btn-leave" class="btn btn--danger">Leave Room</button>
            </div>
          </div>
          <div class="side-body">
            <div class="side-block">
              <label>Room code</label>
              <div class="code-row">
                <code id="room-code">...</code>
                <button id="btn-copy" class="btn btn--ghost">Copy</button>
              </div>
            </div>
            <div class="side-block">
              <label>Players (<span id="player-count">0</span>)</label>
              <ul id="player-list" class="player-list"></ul>
            </div>
          </div>
        </aside>

        <div class="hub-main">
          <div id="game-menu" class="game-menu"></div>
          <div id="game-container" class="game-container"></div>
        </div>
      </div>

      <!-- Dedicated Screen-Share Display Container (Strictly Bounded) -->
      <aside id="screen-share-container" class="screen-share-container hidden" aria-label="Screen Share Viewer">
        <div class="screen-share-header">
          <div class="screen-share-title">
            <span class="screen-live-dot"></span>
            <span id="screen-share-label">Screen Share — Live</span>
          </div>
          <div class="screen-share-actions">
            <button id="btn-screen-fullscreen" type="button" class="screen-ctrl-btn screen-ctrl-btn--fullscreen" title="Tam Ekran / Fullscreen">⛶ Tam Ekran / Fullscreen</button>
            <button id="btn-screen-size" type="button" class="screen-ctrl-btn" title="Toggle theater / compact size">⛶ Expand</button>
            <button id="btn-screen-min" type="button" class="screen-ctrl-btn" title="Minimize / restore screen view">−</button>
            <button id="btn-screen-stop" type="button" class="screen-ctrl-btn screen-ctrl-btn--danger hidden" title="Stop sharing your screen">■ Stop</button>
          </div>
        </div>
        <div class="screen-share-body">
          <video id="screen-video" autoplay playsinline></video>
          <button id="btn-screen-fs-overlay" type="button" class="video-fs-btn screen-fs-overlay-btn" title="Tam Ekran / Fullscreen">⛶ Tam Ekran / Fullscreen</button>
        </div>
      </aside>

      <!-- Floating / Side-Anchored Interactive Camera Dock (Strictly Bounded) -->
      <aside id="video-dock" class="video-dock hidden" aria-label="Live Camera Streams">
        <div class="video-dock-header">
          <span class="video-dock-title">📹 Live Cam</span>
          <div class="video-dock-controls">
            <button id="btn-dock-pos" type="button" class="video-dock-btn" title="Switch dock position">⇄</button>
            <button id="btn-dock-min" type="button" class="video-dock-btn" title="Minimize / restore cameras">−</button>
          </div>
        </div>
        <div class="video-dock-body">
          <div id="local-video-card" class="video-card video-card--local hidden">
            <video id="local-video" autoplay muted playsinline></video>
            <button id="btn-local-fullscreen" type="button" class="video-fs-btn" title="Tam Ekran / Fullscreen">⛶ Tam Ekran</button>
            <div class="video-badge">
              <span class="video-dot video-dot--local"></span>
              <span id="local-video-label">You</span>
            </div>
          </div>
          <div id="remote-video-card" class="video-card video-card--remote hidden">
            <video id="remote-video" autoplay playsinline></video>
            <button id="btn-remote-fullscreen" type="button" class="video-fs-btn" title="Tam Ekran / Fullscreen">⛶ Tam Ekran</button>
            <div class="video-badge">
              <span class="video-dot video-dot--remote"></span>
              <span id="remote-video-label">Partner</span>
            </div>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <!-- Load order matters (plain scripts, so it works from file:// too) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/network.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/hub.js"></script>
  <script src="js/games/tictactoe.js"></script>
  <script src="js/games/numberrace.js"></script>
  <script src="js/games/scrambleboard.js"></script>
  <script src="js/games/tumblematch.js"></script>
  <!-- Add new games here: <script src="js/games/pong.js"></script> -->
  <script src="js/main.js"></script>
</body>
</html>
